<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مغامرة القلعة</title>
<style>
  body {
    margin: 0; padding: 20px;
    background: #111827; color: #f9fafb;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex; justify-content: center; align-items: center;
  }
  .game {
    width: min(700px, 100%);
    background: #1f2937; border-radius: 18px;
    padding: 24px; box-sizing: border-box;
    box-shadow: 0 10px 35px rgba(0,0,0,.35);
  }
  h1 { text-align: center; margin-top: 0; }
  #story { white-space: pre-line; line-height: 1.9; font-size: 19px; }
  input {
    width: 100%; box-sizing: border-box;
    padding: 14px; margin: 14px 0;
    border: 0; border-radius: 10px; font-size: 18px;
  }
  button {
    width: 100%; padding: 14px; border: 0; border-radius: 10px;
    background: #374151; color: white; font-size: 18px; cursor: pointer;
  }
  button:hover { background: #4b5563; }
  .restart { margin-top: 10px; background: #7c3aed; }
  .error { color: #fca5a5; min-height: 24px; }
</style>
</head>
<body>
<div class="game">
  <h1>🏰 مغامرة القلعة</h1>
  <div id="story"></div>
  <input id="answer" type="text" autocomplete="off" placeholder="اكتب اختيارك هنا">
  <button id="submit">اختيار</button>
  <div id="error" class="error"></div>
  <button class="restart" onclick="location.reload()">🔄 إعادة اللعبة</button>
</div>

<script>
let step = "name";
let playerName = "";

const story = document.getElementById("story");
const answer = document.getElementById("answer");
const error = document.getElementById("error");
const submit = document.getElementById("submit");

function show(text, placeholder="اكتب اختيارك هنا") {
  story.textContent = text;
  answer.value = "";
  answer.placeholder = placeholder;
  error.textContent = "";
  answer.focus();
}

function normalize(text) {
  return text.trim().toLowerCase();
}

function finish(text) {
  show(text, "");
  answer.style.display = "none";
  submit.style.display = "none";
}

function play() {
  const value = normalize(answer.value);

  if (step === "name") {
    if (!value) {
      error.textContent = "اكتب اسمك أولاً.";
      return;
    }
    playerName = answer.value.trim();
    step = "castle";
    show(`أهلاً ${playerName}!\n\nأنت أمام القلعة.\n1️⃣ ادخل القلعة\n2️⃣ اهرب`);
    return;
  }

  if (step === "castle") {
    if (value === "1" || value === "ادخل القلعة") {
      step = "guard";
      show("وجدت حارساً أمامك.\n1️⃣ قاتل\n2️⃣ تحدث معه");
    } else if (value === "2" || value === "اهرب") {
      finish("🏃 لقد هربت من القلعة...\nانتهت اللعبة!");
    } else {
      error.textContent = "خيار خاطئ. اختر 1 أو 2.";
    }
    return;
  }

  if (step === "guard") {
    if (value === "1" || value === "قاتل") {
      finish("⚔️ حاولت قتل الحارس...\nلقد قتلك الحارس! خسرت.");
    } else if (value === "2" || value === "تحدث") {
      step = "age";
      show("🤝 تحدثت مع الحارس، فأعطاك مفتاحاً!\n\nكم عمرك؟", "اكتب عمرك");
    } else {
      error.textContent = "خيار خاطئ. اختر 1 أو 2.";
    }
    return;
  }

  if (step === "age") {
    const age = Number(value);
    if (!Number.isInteger(age) || age <= 0 || age >= 120) {
      error.textContent = "عمر خاطئ. أدخل عمراً بين 1 و119.";
      return;
    }

    if (age >= 18) {
      finish("🗡️ يمكنك حمل السيف!\n\nانتهت المرحلة الأولى من مغامرتك بنجاح.");
    } else if (age <= 13) {
      finish("👦 لا يمكنك القدوم إلى القلعة أصلاً!\n\nانتهت اللعبة.");
    } else {
      finish("🛡️ أنت مراهق، ولا يمكنك حمل السيف بعد.\n\nانتهت اللعبة.");
    }
  }
}

submit.addEventListener("click", play);
answer.addEventListener("keydown", e => {
  if (e.key === "Enter") play();
});

show("ما اسمك؟", "اكتب اسمك");
</script>
</body>
</html>
